<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <title>СмИТ Биллинг 3.9 — Кибер-Раннер</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%235BA89D'/><text x='16' y='23' text-anchor='middle' font-family='Arial,sans-serif' font-weight='700' font-size='22' fill='%23fff'>C</text></svg>" type="image/svg+xml" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800;900&family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #020617;
        color: #f1f5f9;
        font-family: 'Exo 2', sans-serif;
        touch-action: none;
      }
      .font-cyber {
        font-family: 'Orbitron', 'Exo 2', sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Signature billing.smit34.ru Glass Card & Tint Button */
      .smit-glass-card {
        -webkit-backdrop-filter: blur(14px) saturate(1.25);
        backdrop-filter: blur(14px) saturate(1.25);
        background: linear-gradient(160deg, #1e2942eb, #131c30db 46%, #0d1424eb);
        border: 1px solid #94a3b83d;
        position: relative;
        box-shadow: 0 12px 38px #00000075, 0 2px 10px #0000004d, inset 0 1px #ffffff1f, inset 1px 0 #ffffff0f;
      }
      .smit-glass-card::before {
        content: "";
        border-radius: inherit;
        pointer-events: none;
        background: linear-gradient(#ffffff1c, #0000 40%), radial-gradient(120% 80% at 8% 0, #6ee7b71a, #0000 58%);
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
      }
      .smit-glass-tint {
        border: 1px solid #ffffff47;
        position: relative;
        overflow: hidden;
        box-shadow: 0 8px 26px #107a5747, inset 0 1px #ffffff73;
      }
      .smit-glass-tint::before {
        content: "";
        pointer-events: none;
        background: linear-gradient(#ffffff47, #0000 46%);
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
      }

      /* Neon Glitch Effect for Combo Multiplier (SMIT Emerald / Teal / Cyan / Magenta) */
      .cyber-glitch {
        position: relative;
        display: inline-block;
        text-shadow:
          -2px 0 #10b981,
          2px 0 #06b6d4,
          0 0 14px rgba(16, 185, 129, 0.75);
        animation: cyber-glitch-skew 2.4s infinite linear alternate-reverse;
      }
      .cyber-glitch::before,
      .cyber-glitch::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .cyber-glitch::before {
        left: 2px;
        text-shadow: -2px 0 #f43f5e, 0 0 10px #f43f5e;
        clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
        animation: cyber-glitch-anim-1 1.6s infinite linear alternate-reverse;
      }
      .cyber-glitch::after {
        left: -2px;
        text-shadow: -2px 0 #34d399, 2px 2px #06b6d4;
        clip-path: polygon(0 58%, 100% 58%, 100% 100%, 0 100%);
        animation: cyber-glitch-anim-2 1.2s infinite linear alternate-reverse;
      }
      .cyber-glitch-burst {
        animation: cyber-burst-pop 0.32s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes cyber-glitch-anim-1 {
        0% { clip-path: inset(12% 0 68% 0); transform: translate(-2px, -1px); }
        20% { clip-path: inset(62% 0 14% 0); transform: translate(2px, 1px); }
        40% { clip-path: inset(38% 0 42% 0); transform: translate(-3px, 0px); }
        60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -1px); }
        80% { clip-path: inset(8% 0 78% 0); transform: translate(-2px, 2px); }
        100% { clip-path: inset(48% 0 30% 0); transform: translate(3px, -1px); }
      }

      @keyframes cyber-glitch-anim-2 {
        0% { clip-path: inset(70% 0 10% 0); transform: translate(2px, 1px); }
        25% { clip-path: inset(15% 0 65% 0); transform: translate(-3px, -1px); }
        50% { clip-path: inset(52% 0 22% 0); transform: translate(2px, -2px); }
        75% { clip-path: inset(25% 0 55% 0); transform: translate(-2px, 1px); }
        100% { clip-path: inset(82% 0 4% 0); transform: translate(3px, 0px); }
      }

      @keyframes cyber-glitch-skew {
        0%, 88%, 100% { transform: skew(0deg); }
        90% { transform: skew(-5deg) scale(1.02); }
        93% { transform: skew(6deg); }
        96% { transform: skew(-3deg); }
      }

      @keyframes cyber-burst-pop {
        0% { transform: scale(1.38) skew(-10deg); filter: brightness(1.8) contrast(1.4); }
        50% { transform: scale(0.95) skew(6deg); }
        100% { transform: scale(1) skew(0deg); filter: brightness(1) contrast(1); }
      }

      /* Glitch Toast Animation for In-Game Achievements */
      .cyber-achievement-toast {
        animation:
          cyber-achievement-entry 0.48s cubic-bezier(0.16, 1, 0.3, 1) forwards,
          cyber-glitch-skew 1.8s infinite linear alternate-reverse;
      }

      @keyframes cyber-achievement-entry {
        0% {
          opacity: 0;
          transform: translateY(-18px) scale(0.88) skewX(-14deg);
          filter: brightness(2.2) contrast(1.6) hue-rotate(45deg);
          clip-path: inset(0 0 85% 0);
        }
        25% {
          opacity: 1;
          transform: translateX(6px) skewX(8deg);
          clip-path: inset(15% 0 10% 0);
        }
        50% {
          transform: translateX(-5px) skewX(-5deg) scale(1.03);
          filter: brightness(1.5) contrast(1.2);
          clip-path: inset(0 0 0 0);
        }
        75% {
          transform: translateX(2px) skewX(2deg);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1) skewX(0deg);
          filter: brightness(1) contrast(1) hue-rotate(0deg);
          clip-path: inset(0 0 0 0);
        }
      }
    </style>
